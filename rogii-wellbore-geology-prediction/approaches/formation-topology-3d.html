.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  var supportToggle = document.getElementById(&quot;rogii-support-toggle&quot;);
  var error = document.getElementById(&quot;rogii-topology-error&quot;);
  var initialized = false;
  var themeTimer = null;

  function color(token) {
    var probe = document.createElement(&quot;span&quot;);
    probe.style.color = &quot;var(&quot; + token + &quot;)&quot;;
    probe.style.display = &quot;none&quot;;
    root.appendChild(probe);
    var value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  }

  function aspectRatio() {
    var exaggeration = Number(zScale.value);
    var horizontal = Math.max(DATA.meta.xSpan, DATA.meta.ySpan);
    return {
      x: DATA.meta.xSpan / horizontal,
      y: DATA.meta.ySpan / horizontal,
      z: ((DATA.meta.zMax - DATA.meta.zMin) / horizontal) * exaggeration
    };
  }

  function zValues(layer) {
    if (!supportToggle.checked) return layer.z;
    return layer.z.map(function (row, iy) {
      return row.map(function (value, ix) {
        return DATA.support[iy][ix] &lt;= DATA.meta.maskFeet ? value : null;
      });
    });
  }

  function traces() {
    var selected = layerSelect.value;
    var series = [
      &quot;--viz-series-1&quot;, &quot;--viz-series-2&quot;, &quot;--viz-series-3&quot;,
      &quot;--viz-series-4&quot;, &quot;--viz-series-5&quot;, &quot;--viz-series-6&quot;
    ];
    var result = DATA.layers.map(function (layer, index) {
      var c = color(series[index]);
      return {
        type: &quot;surface&quot;,
        name: layer.name,
        x: DATA.x,
        y: DATA.y,
        z: zValues(layer),
        customdata: DATA.support,
        colorscale: [[0, c], [1, c]],
        cmin: 0,
        cmax: 1,
        surfacecolor: layer.z.map(function (row) {
          return row.map(function () { return 0.5; });
        }),
        opacity: selected === &quot;all&quot; ? 0.52 : 0.88,
        visible: selected === &quot;all&quot; || selected === layer.name,
        showlegend: true,
        showscale: false,
        connectgaps: false,
        hovertemplate:
          &quot;&lt;b&gt;&quot; + layer.name + &quot;&lt;/b&gt;&lt;br&gt;&quot; +
          &quot;X %{x:,.0f} ft&lt;br&gt;&quot; +
          &quot;Y %{y:,.0f} ft&lt;br&gt;&quot; +
          &quot;Surface Z %{z:,.0f} ft&lt;br&gt;&quot; +
          &quot;Nearest well %{customdata:,.0f} ft&lt;extra&gt;&lt;/extra&gt;&quot;
      };
    });

    result.push({
      type: &quot;scatter3d&quot;,
      mode: &quot;lines&quot;,
      name: &quot;Well paths&quot;,
      x: DATA.paths.x,
      y: DATA.paths.y,
      z: DATA.paths.z,
      visible: pathToggle.checked,
      line: {color: color(&quot;--muted-foreground&quot;), width: 2},
      opacity: 0.32,
      hoverinfo: &quot;skip&quot;
    });
    return result;
  }

  function layout() {
    var foreground = color(&quot;--foreground&quot;);
    var muted = color(&quot;--muted-foreground&quot;);
    var border = color(&quot;--border&quot;);
    return {
      paper_bgcolor: &quot;rgba(0,0,0,0)&quot;,
      plot_bgcolor: &quot;rgba(0,0,0,0)&quot;,
      font: {color: foreground, family: &quot;inherit&quot;},
      margin: {l: 0, r: 0, t: 8, b: 50},
      showlegend: true,
      legend: {
        orientation: &quot;h&quot;,
        x: 0,
        y: -0.04,
        font: {color: foreground}
      },
      hoverlabel: {
        bgcolor: color(&quot;--popover&quot;),
        bordercolor: border,
        font: {color: color(&quot;--popover-foreground&quot;)}
      },
      annotations: [{
        text: DATA.meta.wellCount + &quot; training wells · IDW interpolation · hover for support distance&quot;,
        showarrow: false,
        x: 0,
        y: 1.02,
        xref: &quot;paper&quot;,
        yref: &quot;paper&quot;,
        xanchor: &quot;left&quot;,
        font: {color: muted}
      }],
      scene: {
        bgcolor: &quot;rgba(0,0,0,0)&quot;,
        aspectmode: &quot;manual&quot;,
        aspectratio: aspectRatio(),
        camera: {eye: {x: 1.55, y: -1.65, z: 0.95}},
        xaxis: {
          title: &quot;X easting (ft)&quot;,
          color: foreground,
          gridcolor: border,
          zerolinecolor: border,
          showbackground: false,
          exponentformat: &quot;none&quot;,
          tickformat: &quot;,.0f&quot;
        },
        yaxis: {
          title: &quot;Y northing (ft)&quot;,
          color: foreground,
          gridcolor: border,
          zerolinecolor: border,
          showbackground: false,
          exponentformat: &quot;none&quot;,
          tickformat: &quot;,.0f&quot;
        },
        zaxis: {
          title: &quot;Surface Z elevation (ft)&quot;,
          color: foreground,
          gridcolor: border,
          zerolinecolor: border,
          showbackground: false,
          range: [DATA.meta.zMin, DATA.meta.zMax],
          tickformat: &quot;,.0f&quot;
        }
      },
      uirevision: &quot;keep-camera&quot;
    };
  }

  function render() {
    if (!window.Plotly) return;
    Plotly.react(plot, traces(), layout(), {
      responsive: true,
      displaylogo: false,
      scrollZoom: true,
      modeBarButtonsToRemove: [&quot;toImage&quot;, &quot;sendDataToCloud&quot;]
    });
    initialized = true;
  }

  function init() {
    if (!window.Plotly) {
      if (!initialized) {
        setTimeout(init, 80);
      }
      return;
    }
    render();
    [layerSelect, zScale, pathToggle, supportToggle].forEach(function (control) {
      control.addEventListener(&quot;change&quot;, render);
    });
    var observer = new MutationObserver(function () {
      clearTimeout(themeTimer);
      themeTimer = setTimeout(render, 40);
    });
    observer.observe(document.documentElement, {attributes: true, attributeFilter: [&quot;class&quot;, &quot;style&quot;]});
  }

  try {
    init();
  } catch (e) {
    error.hidden = false;
  }
}());
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
