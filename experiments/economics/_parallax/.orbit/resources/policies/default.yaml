schemaVersion: 2
kind: Policy
metadata:
  name: default
spec:
  description: Default filesystem profile policy for Orbit activity runs
  denyRead:
  - '**/.env'
  - '**/.env.*'
  - '**/*.env'
  - '**/*.env.*'
  denyModify:
  - .orbit/**
  - '**/.env'
  - '**/.env.*'
  - '**/*.env'
  - '**/*.env.*'
  fsProfiles:
    pure_compute:
      read: []
      modify: []
    reviewer:
      read:
      - ./**
      modify: []
    implementer:
      read:
      - ./**
      modify:
      - ./**
    docs_writer:
      read:
      - ./**
      modify:
      - docs/**
      - '!docs/drafts/**'
  created_at: 2026-08-01T08:07:58.527205705Z
  updated_at: 2026-08-01T08:07:58.527205705Z
