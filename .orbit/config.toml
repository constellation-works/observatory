# Observatory Orbit workspace config (dk-server-1 registration, ws_observatory).
# The Mac may register this repo under its own DANI-* prefix; task sets are
# disjoint by prefix (polaris CONVENTIONS: "Task authority is per prefix").

[execution.env]
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",
]

# dk-server-1 is itself the trust boundary for agent runs; codex's inner
# workspace-write sandbox (bwrap netns) fails on this box (F2026-07-002).
# Same setting as the umbrella and orbit workspace configs.
[execution.codex]
sandbox = "danger-full-access"

[workflow]
auto_ship = true
base_branch = "main"
default_crew = "sonnet"
system_crew = "luna"

[crews.opus]
backend = "cli"
model = "claude-opus-5"
provider = "claude"
effort = "high"

[crews.sonnet]
backend = "cli"
model = "claude-sonnet-5"
provider = "claude"
effort = "high"

[crews.luna]
backend = "cli"
model = "gpt-5.6-luna"
provider = "codex"
effort = "xhigh"

[docs]
roots = ["docs/", "questions/", "hypotheses/", "theories/"]

[scoring]
enabled = true

[task.approval]
delegate_approval = true
required_for_agent = true
