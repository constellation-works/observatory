[execution.env]
# Agent subprocesses always run with a cleared environment plus the allowlist
# below — the orbit process's full environment is never inherited (not
# configurable, by design).
# Baseline env vars passed to agent subprocesses.
# User-specific vars (GITHUB_TOKEN, ANTHROPIC_API_KEY, etc.) are opt-in — add them as needed.
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",  # macOS: required by CoreFoundation
]

[execution.codex]
sandbox = "danger-full-access"
# Optional: enable escalation requests for workflows that legitimately need approval.
# approval_policy = "on-request"

[scoring]
enabled = true

[workflow]
auto_ship = true
base_branch = "agent-main"
default_crew = "terra"
system_crew = "luna"

[runtime]
# `backend` selects the v2 `agent_loop` execution backend: "cli" | "http" | "auto".
# backend = "cli"
#
# Rotation + retention for the global JSONL log (~/.orbit/state/logs/orbit.jsonl).
# [ORB-00415] Applied opportunistically at process start. All optional; the
# conservative defaults below are used when a key is omitted. Invalid values
# (0, or log_max_file_mb > log_max_total_mb) are rejected at config load.
# log_retention_days = 7    # delete archives older than N days (>= 1)
# log_max_total_mb   = 500  # total MiB budget across archives; oldest pruned first (>= 1)
# log_max_file_mb    = 100  # roll the active log once it exceeds N MiB (>= 1, <= log_max_total_mb)

[crews.fable]
model = "fable"
provider = "claude"
backend = "cli"

[crews.gemini]
model = "pro"
provider = "gemini"
backend = "cli"

[crews.luna]
model = "gpt-5.6-luna"
provider = "codex"
backend = "cli"

[crews.opus]
model = "opus"
provider = "claude"
backend = "cli"

[crews.qa]
model = "luna"
provider = "codex"
backend = "cli"

[crews.sol]
model = "gpt-5.6-sol"
provider = "codex"
backend = "cli"

[crews.sonnet]
model = "sonnet"
provider = "claude"
backend = "cli"

[crews.terra]
model = "gpt-5.6-terra"
provider = "codex"
backend = "cli"