[project]
name = "parallax"
version = "0.1.0"
description = "Domain-neutral platform for falsifiable, reproducible empirical research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=18.0",
]

[project.scripts]
parallax = "parallax.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
notebook = [
    "ipykernel>=6.29",
    "matplotlib>=3.11.1",
    "notebook>=7.4",
    "pandas>=3.0.5",
]
# Only the live capture recorder needs a websocket client; analysis never does.
capture = [
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
