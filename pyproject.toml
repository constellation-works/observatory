[project]
name = "observatory"
version = "0.1.0"
description = "The research knowledgebase: questions, hypotheses, research items and theories."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "scipy>=1.13",
    "pyarrow>=16",
    "orrery",
    "astrolabe",
    "parallax",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbstripout>=0.7"]
spark = ["pyspark>=3.5"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.6", "kaggle>=1.6"]
arc = ["torch>=2.6", "tqdm>=4.66"]
# Kept for `make check-archive` only: principia's record checkers
# (_archive/principia/scripts/corpus_records.py) import orbit_research at this exact
# revision, and the lock is archived byte-for-byte rather than ported. Nothing in
# `make check` needs it.
research = [
    "orbit-research @ git+https://github.com/constellation-works/orbit-research.git@0a9cf756e1c2522b9d5ee71c1cf462b8676f4281",
    "jsonschema>=4.26",
]

# orrery and parallax are archived, not live, but sim code migrated into research
# items still imports the `orrery` package, so both stay installable from where the
# archive keeps them.
[tool.uv.workspace]
members = ["_archive/orrery", "_lib/astrolabe", "_archive/parallax"]

[tool.uv.sources]
orrery = { workspace = true }
astrolabe = { workspace = true }
parallax = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[tool.ruff]
line-length = 100
# The archive is frozen history and is never linted; notebooks are free-form
# exploration and carry no contract; data and outputs are not code.
extend-exclude = ["_archive", "_data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Competition code migrated as written; long lines and lenient zip() stay.
"research/R01*/**" = ["E501", "B905"]
# Field-guide chapters migrated as written, as the sims they came in beside were.
"docs/field-guide/**" = ["E501"]
# The gallery generator is one long HTML/CSS literal.
"_lib/tools/build-gallery.py" = ["E501"]
# Sims migrated from orrery keep their style; a new sim under a research item is
# held to the full set.
"research/*/code/*/*.py" = ["B007", "B023", "B905", "E501", "E701", "E702", "E731", "F841"]

[tool.pytest.ini_options]
# The gate runs the tests of the shared apparatus and of the shared tooling. A
# research item's own tests are run from its directory, not by the gate.
testpaths = ["_lib", "_scripts"]
python_files = ["test_*.py"]
# importlib mode: several subtrees have a tests/test_cli.py of their own.
addopts = "--import-mode=importlib"
