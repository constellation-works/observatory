[project]
name = "observatory"
version = "0.1.0"
description = "Unified research platform: idea lineage, experiments, studies, theory."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "scipy>=1.13",
    "pyarrow>=16",
    "orrery",
    "astrolabe",
    "parallax",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbstripout>=0.7"]
spark = ["pyspark>=3.5"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.6", "kaggle>=1.6"]
arc = ["torch>=2.6", "tqdm>=4.66"]
# The scientific record checkers (knowledgebase/theory/scripts) require this exact
# orbit-research revision; see knowledgebase/theory/research/README.md.
research = [
    "orbit-research @ git+https://github.com/constellation-works/orbit-research.git@0a9cf756e1c2522b9d5ee71c1cf462b8676f4281",
    "jsonschema>=4.26",
]

[tool.uv.workspace]
members = ["experiments/physics/_orrery", "lib/astrolabe", "experiments/economics/_parallax"]

[tool.uv.sources]
orrery = { workspace = true }
astrolabe = { workspace = true }
parallax = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[tool.ruff]
line-length = 100
# Migration staging areas are migrated as written; lint applies once a sim moves
# to its node directory under experiments/<domain>/<node-id>/.
extend-exclude = ["_data", "_outputs", "knowledgebase", "experiments/physics/_orrery", "experiments/economics/_parallax"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Competition code migrated as written; long lines and lenient zip() stay.
"experiments/kaggle/**" = ["E501", "B905"]
# Sims migrated from orrery keep their style; new sims under a node are held to the full set.
"experiments/physics/*/*/*.py" = ["B007", "B023", "B905", "E501", "E701", "E702", "E731", "F841"]

[tool.pytest.ini_options]
testpaths = ["_scripts", "experiments", "knowledgebase/theory/scripts", "lib/astrolabe/tests"]
python_files = ["test_*.py"]
# parallax's consumer-goods tests import a package, and its repository-conventions
# tests describe a tree (R00-scratch, R03-consumer-goods), that do not exist in the
# migrated history; they fail identically in the source checkout, which had no
# remote configured (the box may be ahead). Ignored until reconciled.
# importlib mode: several subtrees have a tests/test_cli.py. The theory record
# tests import their sibling scripts by bare name.
pythonpath = ["knowledgebase/theory/scripts"]
# _orrery/tests exercise the frozen live-drift record check, retired when the sims
# moved to node directories (docs/runbooks/migration.md).
addopts = "--import-mode=importlib --ignore=experiments/physics/_orrery/tests --ignore-glob=experiments/economics/_parallax/tests/test_consumer_goods_*.py --ignore=experiments/economics/_parallax/tests/test_state_panel.py --ignore=experiments/economics/_parallax/tests/test_repository_conventions.py"
