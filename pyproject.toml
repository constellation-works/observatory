[project]
name = "observatory"
version = "0.1.0"
description = "Unified research platform: idea lineage, experiments, studies, theory."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "scipy>=1.13",
    "pyarrow>=16",
    "orrery",
    "astrolabe",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbstripout>=0.7"]
spark = ["pyspark>=3.5"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.6", "kaggle>=1.6"]
arc = ["torch>=2.6", "tqdm>=4.66"]
# The scientific record checkers (knowledgebase/theory/scripts) require this exact
# orbit-research revision; see knowledgebase/theory/research/README.md.
research = [
    "orbit-research @ git+https://github.com/constellation-works/orbit-research.git@0a9cf756e1c2522b9d5ee71c1cf462b8676f4281",
    "jsonschema>=4.26",
]

[tool.uv.workspace]
members = ["experiments/physics/_orrery", "lib/astrolabe"]

[tool.uv.sources]
orrery = { workspace = true }
astrolabe = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[tool.ruff]
line-length = 100
# Migration staging areas are migrated as written; lint applies once a sim moves
# to its node directory under experiments/<domain>/<node-id>/.
extend-exclude = ["_data", "_outputs", "knowledgebase", "experiments/physics/_orrery"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Competition code migrated as written; long lines and lenient zip() stay.
"experiments/kaggle/**" = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["_scripts", "experiments", "knowledgebase/theory/scripts", "lib/astrolabe/tests"]
python_files = ["test_*.py"]
